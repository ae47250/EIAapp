<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EIA Data Extraction Tool</title>
  <style>
    :root {
      --bg-1: #061428;
      --bg-2: #0d2441;
      --bg-3: #123a63;
      --panel: rgba(255, 255, 255, 0.96);
      --ink: #0f172a;
      --muted: #516074;
      --accent: #0f6fff;
      --border: rgba(148, 163, 184, 0.28);
      --shadow: 0 22px 60px rgba(2, 10, 23, 0.26);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 111, 255, 0.28), transparent 34%),
        radial-gradient(circle at 92% 10%, rgba(10, 166, 196, 0.22), transparent 28%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent 88%);
      opacity: 0.36;
    }
    main {
      width: min(100%, 420px);
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(242, 250, 255, 0.96));
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    main::after {
      content: "";
      position: absolute;
      inset: auto -120px -120px auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15, 111, 255, 0.16), transparent 68%);
      pointer-events: none;
    }
    h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.05; }
    p { margin: 0 0 22px; color: var(--muted); }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input, button { width: 100%; border-radius: 12px; font: inherit; }
    input {
      border: 1px solid rgba(71, 85, 105, 0.2);
      padding: 12px 13px;
      background: rgba(255, 255, 255, 0.98);
      color: var(--ink);
    }
    input:focus {
      outline: 3px solid rgba(15, 111, 255, 0.18);
      border-color: rgba(15, 111, 255, 0.55);
    }
    button {
      margin-top: 20px;
      border: 0;
      padding: 13px 16px;
      color: white;
      background: linear-gradient(135deg, var(--accent) 0%, #0a58cc 55%, #0a3e92 100%);
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(15, 111, 255, 0.22);
    }
    button:hover:not(:disabled) { filter: brightness(1.03); transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.65; transform: none; }
    #error { margin: 16px 0 0; color: #991b1b; font-weight: 700; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(15, 111, 255, 0.09);
      color: #0b4fb6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Protected access</div>
    <h1>Login</h1>
    <p>Sign in to use the EIA Data Extraction Tool.</p>
    <form id="loginForm" method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <input id="returnTo" name="returnTo" type="hidden" value="/" />
      <button id="submitButton" type="submit">Login</button>
      <div id="error" role="alert" aria-live="polite" hidden>Invalid username or password.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const error = document.getElementById("error");
    const params = new URLSearchParams(window.location.search);
    document.getElementById("returnTo").value = params.get("returnTo") || "/";

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch(form.action, { method: "POST", body: new URLSearchParams(new FormData(form)) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error("login-failed");
        window.location.assign(data.returnTo || "/");
      } catch {
        error.hidden = false;
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
