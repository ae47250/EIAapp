<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EIA Data Extraction Tool</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #111827;
      background: linear-gradient(135deg, #008cff 0%, #00a3ff 45%, #6fd3ff 100%);
    }
    main {
      width: min(100%, 390px);
      padding: 30px;
      border: 1px solid #b9e8ff;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 22px; color: #4b5563; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input, button { width: 100%; border-radius: 10px; font: inherit; }
    input { border: 1px solid #9ca3af; padding: 12px 13px; background: white; }
    input:focus { outline: 3px solid rgba(0, 140, 255, 0.25); border-color: #0057d9; }
    button { margin-top: 20px; border: 0; padding: 13px 16px; color: white; background: #0057d9; cursor: pointer; font-weight: 700; }
    button:hover:not(:disabled) { background: #003f9e; }
    button:disabled { cursor: wait; opacity: 0.65; }
    #error { margin: 16px 0 0; color: #991b1b; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Login</h1>
    <p>Sign in to use the EIA Data Extraction Tool.</p>
    <form id="loginForm" method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <input id="returnTo" name="returnTo" type="hidden" value="/" />
      <button id="submitButton" type="submit">Login</button>
      <div id="error" role="alert" aria-live="polite" hidden>Invalid username or password.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const error = document.getElementById("error");
    const params = new URLSearchParams(window.location.search);
    document.getElementById("returnTo").value = params.get("returnTo") || "/";

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.hidden = true;
      button.disabled = true;

      try {
        const response = await fetch(form.action, { method: "POST", body: new URLSearchParams(new FormData(form)) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error("login-failed");
        window.location.assign(data.returnTo || "/");
      } catch {
        error.hidden = false;
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
